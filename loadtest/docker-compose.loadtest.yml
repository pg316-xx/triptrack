# Overrides for a load-test run. Use together with the main file:
#   docker compose -f docker-compose.yml -f loadtest/docker-compose.loadtest.yml up -d --build
services:
  backend:
    environment:
      # Default Hikari pool is 10 connections, which caps throughput long before CPU does.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "40"
      SERVER_TOMCAT_THREADS_MAX: "400"
      SERVER_TOMCAT_ACCEPT_COUNT: "500"
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_TRIPNEXT: WARN
      # load tests register many users from one machine and shouldn't send mail
      RATE_LIMIT_ENABLED: "false"
      MAIL_ENABLED: "false"
      # Let the JVM use half the VM's RAM (default is a quarter).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+UseG1GC"
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  postgres:
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - synchronous_commit=off   # test box only: faster writes, may lose the last ms on a crash

  # The UI isn't part of an API load test; skip building/running it.
  frontend:
    profiles: ["ui"]
