spring.application.name=demo

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
storage.endpoint=${S3_ENDPOINT:}
storage.public-endpoint=${S3_PUBLIC_ENDPOINT:}
storage.region=${S3_REGION:us-east-1}
storage.access-key=${S3_ACCESS_KEY:}
storage.secret-key=${S3_SECRET_KEY:}
storage.path-style=${S3_PATH_STYLE:true}
storage.url-expiry-minutes=${S3_URL_EXPIRY_MINUTES:15}
storage.upload-url-expiry-minutes=${S3_UPLOAD_URL_EXPIRY_MINUTES:15}
storage.bucket.documents=${S3_BUCKET_DOCUMENTS:docs}
storage.bucket.media=${S3_BUCKET_MEDIA:tripfiles}
storage.bucket.wallet=${S3_BUCKET_WALLET:wallet}
google.client.id=${GOOGLE_CLIENT_ID}

# Redis Configuration
spring.data.redis.url=${REDIS_URL}
spring.cache.type=redis
# Comma-separated list of frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:50MB}

# Base URL of the frontend, used to build invitation links
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Email (SMTP). Locally: Mailpit (docker-compose). On AWS: Amazon SES SMTP endpoint + credentials.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:TripNest <no-reply@tripnest.local>}
app.mail.enabled=${MAIL_ENABLED:true}

# Rate limiting on auth endpoints (Redis-backed, shared across instances)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

# External data providers. Without keys, free keyless providers are used:
# OpenStreetMap Nominatim for places and Open-Meteo for weather.
app.places.google-api-key=${GOOGLE_MAPS_API_KEY:}
app.places.user-agent=${PLACES_USER_AGENT:TripNest/1.0 (local development)}
app.weather.openweather-api-key=${OPENWEATHER_API_KEY:}

# Correlation id on every log line (see RequestIdFilter)
logging.pattern.level=%5p [%X{requestId:-}]

# Health endpoint for load balancer checks (no details exposed)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Mail and Redis are optional at runtime (the app degrades gracefully), so they
# must not mark the instance unhealthy and get it pulled from the load balancer.
management.health.mail.enabled=false
management.health.redis.enabled=false
